services:
  postgres:
    image: postgres:16-alpine
    container_name: polamraksha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-polamraksha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-polamraksha_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-polamraksha}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - polamraksha_pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-polamraksha} -d ${POSTGRES_DB:-polamraksha}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polamraksha-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-polamraksha}:${POSTGRES_PASSWORD:-polamraksha_dev_pass}@postgres:5432/${POSTGRES_DB:-polamraksha}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polamraksha-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.runner"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-polamraksha}:${POSTGRES_PASSWORD:-polamraksha_dev_pass}@postgres:5432/${POSTGRES_DB:-polamraksha}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polamraksha-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-ws://localhost:8000}
      VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-te}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  polamraksha_pgdata:

