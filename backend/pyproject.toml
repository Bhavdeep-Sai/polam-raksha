[project]
name = "polamraksha-backend"
version = "0.1.0"
description = "PolamRaksha (పొలంరక్ష) agricultural surplus recovery platform backend"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "argon2-cffi>=23.1.0,<26.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ortools>=9.11.0,<10.0.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "pyjwt[crypto]>=2.9.0,<3.0.0",
    "sqlalchemy>=2.0.35,<3.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
speech = [
    "SpeechRecognition>=3.10.0,<4.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.7.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

